server: { port: 8080 }
spring:
  datasource: { url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/approval_hub}", username: "${DATABASE_USER:approval}", password: "${DATABASE_PASSWORD:approval}" }
  jpa: { open-in-view: false, hibernate: { ddl-auto: validate } }
  flyway: { enabled: true }
management.endpoints.web.exposure.include: health
app.cors-origin: "${CORS_ORIGIN:http://localhost:3000}"

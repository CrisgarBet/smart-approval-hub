      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /api-gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /approval-service
    schedule:
      interval: weekly
